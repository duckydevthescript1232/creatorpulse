name: Build CreatorPulse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-build
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare CreatorPulse 1.5 Android source
        run: |
          base64 -d android-app/build-source/LauncherActivity.java.gz.b64 | gzip -dc > android-app/app/src/main/java/com/creatorpulse/app/LauncherActivity.java
          base64 -d android-app/build-source/MainActivity.java.gz.b64 | gzip -dc > android-app/app/src/main/java/com/creatorpulse/app/MainActivity.java
          patch -d android-app/app/src/main/java/com/creatorpulse/app -p0 < android-app/build-source/launcher-v1.5.patch
          sed -i 's/CreatorPulseAndroid\/1\.4/CreatorPulseAndroid\/1.5/g' android-app/app/src/main/java/com/creatorpulse/app/LauncherActivity.java
          sed -i 's/CreatorPulseAndroid\/1\.4/CreatorPulseAndroid\/1.5/g' android-app/app/src/main/java/com/creatorpulse/app/MainActivity.java
          grep -q 'CreatorPulseAndroid/1.5' android-app/app/src/main/java/com/creatorpulse/app/LauncherActivity.java
          grep -q 'Continue with Google' android-app/app/src/main/java/com/creatorpulse/app/LauncherActivity.java
          grep -q 'CreatorPulseAndroid/1.5' android-app/app/src/main/java/com/creatorpulse/app/MainActivity.java
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
