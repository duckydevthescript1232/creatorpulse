name: Build CreatorPulse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-build
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
