name: Build CreatorForge APK

on:
  push:
    branches:
      - creatorforge-apk-build-20260919
    paths:
      - 'creatorforge-apk/**'
      - '.github/workflows/build-creatorforge-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: creatorforge-apk
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp creatorforge-apk/app/build/outputs/apk/debug/app-debug.apk CreatorForge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorForge-APK
          path: CreatorForge.apk
          if-no-files-found: error
