name: Build CreatorPulse Free Android App

on:
  push:
    paths:
      - 'android-free-source/**'
      - '.github/workflows/build-free-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat android-free-source/source.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/creatorpulse-free-source.zip
          echo "e0f25b3846a65d8e22ec4bd2e21b0ca7ae2e5df4482a839d099d55538ec5fa56  /tmp/creatorpulse-free-source.zip" | sha256sum -c -
          rm -rf /tmp/creatorpulse-free
          mkdir -p /tmp/creatorpulse-free
          unzip -q /tmp/creatorpulse-free-source.zip -d /tmp/creatorpulse-free
          test -f /tmp/creatorpulse-free/CreatorPulse-Free-Android-App/app/build.gradle.kts
          test -f /tmp/creatorpulse-free/CreatorPulse-Free-Android-App/app/src/main/java/com/creatorpulse/free/MainActivity.java

      - name: Build APK
        working-directory: /tmp/creatorpulse-free/CreatorPulse-Free-Android-App
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/creatorpulse-free/CreatorPulse-Free-Android-App/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CreatorPulse-Free-1.0.0.apk"
          test -s "$GITHUB_WORKSPACE/CreatorPulse-Free-1.0.0.apk"
          unzip -t "$GITHUB_WORKSPACE/CreatorPulse-Free-1.0.0.apk"
          sha256sum "$GITHUB_WORKSPACE/CreatorPulse-Free-1.0.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-Free-Android-1.0.0
          path: CreatorPulse-Free-1.0.0.apk
          if-no-files-found: error
          retention-days: 14
