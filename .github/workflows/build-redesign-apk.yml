name: Build CreatorPulse 1.7.0 Android App

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-redesign-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild verified Android source
        shell: bash
        run: |
          set -euo pipefail
          cat android-native/source.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/creatorpulse-native-src.zip
          echo "e0ca67458cdb47de390759f8e3de74d9b35fe982907b679878b3ba8fae9b60d1  /tmp/creatorpulse-native-src.zip" | sha256sum -c -
          rm -rf /tmp/creatorpulse-native
          mkdir -p /tmp/creatorpulse-native
          unzip -q /tmp/creatorpulse-native-src.zip -d /tmp/creatorpulse-native
          test -f /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/build.gradle.kts
          test -f /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/src/main/java/com/creatorpulse/app/MainActivity.java

      - name: Apply Android-native phone UI fixes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch_creatorpulse.py <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN')
          gradle = root / 'app/build.gradle.kts'
          g = gradle.read_text()
          g = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 15', g)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.7.0"', g)
          gradle.write_text(g)

          p = root / 'app/src/main/java/com/creatorpulse/app/MainActivity.java'
          s = p.read_text()
          s = re.sub(r'private static final String UA = "CreatorPulseAndroid/[^"]+";', 'private static final String UA = "CreatorPulseAndroid/1.7.0";', s)

          if 'import android.view.WindowInsets;' not in s:
              s = s.replace('import android.view.Gravity;\n', 'import android.view.Gravity;\nimport android.view.WindowInsets;\n', 1)
          if 'import android.widget.ImageView;' not in s:
              s = s.replace('import android.widget.FrameLayout;\n', 'import android.widget.FrameLayout;\nimport android.widget.ImageView;\n', 1)

          if 'applySystemBarInsets();' not in s:
              needle = '        setContentView(root);\n\n        chrome(false);'
              if needle not in s:
                  raise SystemExit('setContentView hook not found')
              s = s.replace(needle, '        setContentView(root);\n        applySystemBarInsets();\n\n        chrome(false);', 1)

          s = s.replace('        s.setTextZoom(100);', '        s.setTextZoom(118);', 1)
          s = s.replace('FrameLayout.LayoutParams tp = new FrameLayout.LayoutParams(-1, dp(56));', 'FrameLayout.LayoutParams tp = new FrameLayout.LayoutParams(-1, dp(60));', 1)
          s = s.replace('FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, dp(66));', 'FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, dp(62));', 1)
          s = s.replace('        p.topMargin = show ? dp(56) : 0;', '        p.topMargin = show ? dp(60) : 0;', 1)
          s = s.replace('        p.bottomMargin = show ? dp(66) : 0;', '        p.bottomMargin = show ? dp(62) : 0;', 1)

          new_nav = '''    private LinearLayout bottomBar() {
                  LinearLayout b = row();
                  b.setPadding(dp(8), dp(4), dp(8), dp(4));
                  b.setBackground(shape(Color.rgb(11, 13, 21), 20, Color.rgb(35, 40, 55)));
                  nav(b, R.drawable.nav_home, "Home", "/dashboard");
                  nav(b, R.drawable.nav_ideas, "Ideas", "/ideas");
                  nav(b, R.drawable.nav_videos, "Videos", "/videos");
                  nav(b, R.drawable.nav_analytics, "Analytics", "/analytics");
                  nav(b, R.drawable.nav_tools, "Tools", "/tools");
                  return b;
              }

              private void nav(LinearLayout b, int iconRes, String label, String path) {
                  LinearLayout x = new LinearLayout(this);
                  x.setOrientation(LinearLayout.VERTICAL);
                  x.setGravity(Gravity.CENTER);
                  x.setPadding(dp(2), dp(2), dp(2), 0);
                  ImageView i = new ImageView(this);
                  i.setImageResource(iconRes);
                  i.setColorFilter(PURPLE2);
                  i.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                  TextView t = txt(label, Color.rgb(211, 214, 227), 10, false);
                  t.setGravity(Gravity.CENTER);
                  x.addView(i, new LinearLayout.LayoutParams(dp(28), dp(28)));
                  x.addView(t, new LinearLayout.LayoutParams(-1, dp(18)));
                  x.setOnClickListener(v -> go(path));
                  b.addView(x, new LinearLayout.LayoutParams(0, -1, 1));
              }

              private void applySystemBarInsets() {
                  root.setOnApplyWindowInsetsListener((v, insets) -> {
                      int topInset;
                      int bottomInset;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          android.graphics.Insets bars = insets.getInsets(WindowInsets.Type.systemBars());
                          topInset = bars.top;
                          bottomInset = bars.bottom;
                      } else {
                          topInset = insets.getSystemWindowInsetTop();
                          bottomInset = insets.getSystemWindowInsetBottom();
                      }
                      v.setPadding(0, topInset, 0, bottomInset);
                      return insets;
                  });
                  root.requestApplyInsets();
              }

          '''
          pat = r'    private LinearLayout bottomBar\(\) \{.*?    private void chrome\(boolean show\) \{'
          replacement = new_nav + '    private void chrome(boolean show) {'
          s, count = re.subn(pat, lambda m: replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'bottom nav block match count={count}')

          css_replacements = {
              'html{width:100%!important;max-width:100%!important;min-width:0!important;font-size:16px!important;': 'html{width:100%!important;max-width:100%!important;min-width:0!important;font-size:17px!important;',
              '.cp-shell-v3 .dashboard-content,.cp-dashboard-content,.dashboard-content{width:100%!important;max-width:none!important;min-width:0!important;margin:0!important;padding:16px 14px 28px!important;}': '.cp-shell-v3 .dashboard-content,.cp-dashboard-content,.dashboard-content{width:100%!important;max-width:none!important;min-width:0!important;margin:0!important;padding:18px 14px 32px!important;}',
              '.cp-dashboard-head h1,.cp-page-title h1{font-size:26px!important;': '.cp-dashboard-head h1,.cp-page-title h1{font-size:28px!important;',
              '.cp-dashboard-head p,.cp-page-title p{font-size:13px!important;': '.cp-dashboard-head p,.cp-page-title p{font-size:14px!important;',
              '.cp-data-source-note,.cp-warning-ribbon{width:100%!important;border-radius:16px!important;padding:12px 13px!important;margin-bottom:12px!important;}': '.cp-data-source-note{display:none!important}.cp-warning-ribbon{width:100%!important;border-radius:16px!important;padding:12px 13px!important;margin-bottom:12px!important;font-size:13px!important;}',
              '.cp-home-metrics article{min-width:0!important;min-height:116px!important;padding:14px!important;': '.cp-home-metrics article{min-width:0!important;min-height:128px!important;padding:16px!important;',
              '.cp-home-metrics strong{font-size:20px!important;': '.cp-home-metrics strong{font-size:25px!important;',
              '.cp-home-metrics span{font-size:11px!important;}.cp-home-metrics small{font-size:10px!important;': '.cp-home-metrics span{font-size:13px!important;}.cp-home-metrics small{font-size:12px!important;',
              '.cp-opportunity-copy h2{font-size:22px!important;': '.cp-opportunity-copy h2{font-size:23px!important;',
              '.cp-opportunity-copy p{font-size:13px!important;': '.cp-opportunity-copy p{font-size:14px!important;',
              '.cp-mini-list strong{font-size:13px!important;': '.cp-mini-list strong{font-size:14px!important;',
              '.button,button[type=submit],.primary-button{min-height:48px!important;width:auto!important;border-radius:14px!important;font-size:13px!important;': '.button,button[type=submit],.primary-button{min-height:50px!important;width:auto!important;border-radius:14px!important;font-size:14px!important;',
          }
          for old, new in css_replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)

          needle = '".topic-table,.video-table,.table-scroll,[class*=table-wrap]{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;}" +'
          extra = '".topic-table,.video-table,.table-scroll,[class*=table-wrap]{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;}" +\n            ".cp-home-panel h2,.cp-home-panel h3,.analytics-card h2,.analytics-card h3{font-size:18px!important;line-height:1.3!important}.cp-home-panel p,.cp-home-panel li,.analytics-card p,.analytics-card li{font-size:14px!important;line-height:1.5!important}.cp-mini-list small{font-size:12px!important}.cp-home-panel a,.cp-home-panel button{font-size:14px!important;}" +'
          if needle in s:
              s = s.replace(needle, extra, 1)

          p.write_text(s)

          drawable = root / 'app/src/main/res/drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          icons = {
          'nav_home.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M3.5,10.8L12,3.8l8.5,7v8.7a1,1 0,0 1,-1,1h-5.2v-6h-4.6v6H4.5a1,1 0,0 1,-1,-1z"/></vector>''',
          'nav_ideas.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M9,18h6M10,21h4M8.6,14.8c-1.2,-1 -2.1,-2.5 -2.1,-4.3A5.5,5.5 0,0 1,12,5a5.5,5.5 0,0 1,5.5 5.5c0,1.8 -0.9,3.3 -2.1,4.3 -0.8,0.7 -1.1,1.2 -1.2,2.2h-4.4c-0.1,-1 -0.4,-1.5 -1.2,-2.2zM12,1.8v1.4M3.8,5.2l1.1,0.9M20.2,5.2l-1.1,0.9"/></vector>''',
          'nav_videos.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M4,5.5h16a1.5,1.5 0,0 1,1.5 1.5v10a1.5,1.5 0,0 1,-1.5 1.5H4A1.5,1.5 0,0 1,2.5 17V7A1.5,1.5 0,0 1,4 5.5zM10,9l5,3 -5,3z"/></vector>''',
          'nav_analytics.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M4,20V12h4v8M10,20V7h4v13M16,20V3h4v17M2.5,20.5h19"/></vector>''',
          'nav_tools.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.9" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M14.7,6.1a4.4,4.4 0,0 0,-5.9 5.9L3.5,17.3a2.1,2.1 0,1 0,3 3l5.3,-5.3a4.4,4.4 0,0 0,5.9 -5.9l-2.6,2.6 -2.8,-0.5 -0.5,-2.8z"/></vector>''',
          }
          for name, data in icons.items():
              (drawable / name).write_text(data)

          required = [
              'applySystemBarInsets();',
              's.setTextZoom(118);',
              'R.drawable.nav_home',
              'ImageView i = new ImageView(this);',
          ]
          if not all(x in s for x in required):
              raise SystemExit('patch verification failed')
          for name in icons:
              if not (drawable/name).is_file(): raise SystemExit(f'missing {name}')
          print('CreatorPulse Android 1.7.0 phone patch verified')
          PY
          python3 /tmp/patch_creatorpulse.py

      - name: Build APK
        working-directory: /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CreatorPulse-1.7.0-ANDROID.apk"
          unzip -t "$GITHUB_WORKSPACE/CreatorPulse-1.7.0-ANDROID.apk"
          test -s "$GITHUB_WORKSPACE/CreatorPulse-1.7.0-ANDROID.apk"
          sha256sum "$GITHUB_WORKSPACE/CreatorPulse-1.7.0-ANDROID.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-1.7.0-ANDROID
          path: CreatorPulse-1.7.0-ANDROID.apk
          if-no-files-found: error
          retention-days: 14
