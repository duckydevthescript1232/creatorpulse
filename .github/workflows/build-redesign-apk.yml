name: Build CreatorPulse 1.6.1 Android Native APK

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-redesign-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild verified Android source
        shell: bash
        run: |
          set -euo pipefail
          cat android-native/source.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/creatorpulse-native-src.zip
          echo "e0ca67458cdb47de390759f8e3de74d9b35fe982907b679878b3ba8fae9b60d1  /tmp/creatorpulse-native-src.zip" | sha256sum -c -
          rm -rf /tmp/creatorpulse-native
          mkdir -p /tmp/creatorpulse-native
          unzip -q /tmp/creatorpulse-native-src.zip -d /tmp/creatorpulse-native
          test -f /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/build.gradle.kts

      - name: Build APK
        working-directory: /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-ANDROID-NATIVE.apk"
          unzip -t "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-ANDROID-NATIVE.apk"
          test -s "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-ANDROID-NATIVE.apk"
          sha256sum "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-ANDROID-NATIVE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-1.6.1-ANDROID-NATIVE
          path: CreatorPulse-1.6.1-ANDROID-NATIVE.apk
          if-no-files-found: error
          retention-days: 14
