name: Build CreatorPulse 1.6.0 Android APK

on:
  push:
    paths:
      - 'android-redesign/native.part*.b64'
      - '.github/workflows/build-redesign-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source archive
        shell: bash
        run: |
          set -euo pipefail
          cat android-redesign/native.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/creatorpulse-src.zip
          echo "31cb3fa8d7e475cd05d2ebfa2307d28a773098184abfb7f448c6b1339f6c457e  /tmp/creatorpulse-src.zip" | sha256sum -c -
          mkdir -p /tmp/creatorpulse-src
          unzip -q /tmp/creatorpulse-src.zip -d /tmp/creatorpulse-src
          test -f /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN/app/build.gradle.kts

      - name: Build APK
        working-directory: /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CreatorPulse-1.6.0-ANDROID.apk"
          unzip -t "$GITHUB_WORKSPACE/CreatorPulse-1.6.0-ANDROID.apk"
          ls -lh "$GITHUB_WORKSPACE/CreatorPulse-1.6.0-ANDROID.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-1.6.0-ANDROID
          path: CreatorPulse-1.6.0-ANDROID.apk
          if-no-files-found: error
          retention-days: 14
