name: Build CreatorPulse 1.6.1 Full UI Free APK

on:
  push:
    paths:
      - '.github/workflows/build-redesign-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source archive
        shell: bash
        run: |
          set -euo pipefail
          cat android-redesign/native.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/creatorpulse-src.zip
          echo "31cb3fa8d7e475cd05d2ebfa2307d28a773098184abfb7f448c6b1339f6c457e  /tmp/creatorpulse-src.zip" | sha256sum -c -
          mkdir -p /tmp/creatorpulse-src
          unzip -q /tmp/creatorpulse-src.zip -d /tmp/creatorpulse-src
          test -f /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN/app/build.gradle.kts

      - name: Apply 1.6.1 free mode and polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('/tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN')
          gradle = root / 'app/build.gradle.kts'
          text = gradle.read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 11', text)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.6.1"', text)
          gradle.write_text(text)

          for name in ['MainActivity.java', 'LauncherActivity.java']:
              p = root / 'app/src/main/java/com/creatorpulse/app' / name
              t = p.read_text().replace('CreatorPulseAndroid/1.6.0', 'CreatorPulseAndroid/1.6.1')
              p.write_text(t)

          p = root / 'app/src/main/java/com/creatorpulse/app/MainActivity.java'
          s = p.read_text()
          free_css = ".cp-upgrade-card,a[href='/pricing'],a[href^='/pricing?'],form[action*='/billing'],#billing,.billing-management,.billing-notice,.pricing-page-section,.pricing-hero,.pricing-grid,.pricing-assurance{display:none!important}.settings-index a[href='#billing']{display:none!important}.locked{opacity:1!important;filter:none!important}.current-plan{background:rgba(139,92,246,.14)!important;border-color:rgba(139,92,246,.35)!important;color:#d8ccff!important}"
          if 'String css =' in s and free_css not in s:
              s = s.replace('String css =', 'String css = ' + json.dumps(free_css) + ' +', 1)

          free_js = """(function(){function f(){if(!document.body)return;if(location.pathname==='/pricing'){location.replace('/dashboard');return;}document.body.setAttribute('data-cp-free','1');document.querySelectorAll(\".cp-upgrade-card,a[href='/pricing'],a[href^='/pricing?'],form[action*='/billing'],#billing,.billing-management,.billing-notice,.pricing-grid,.pricing-assurance\").forEach(function(el){el.style.display='none';});document.querySelectorAll(\".settings-index a[href='#billing']\").forEach(function(el){el.style.display='none';});document.querySelectorAll('.locked').forEach(function(a){var m=((a.textContent||'').match(/(\\d+)D/));if(m){a.classList.remove('locked');a.href='/analytics?days='+m[1];a.textContent=m[1]+'D';a.title='';}});document.querySelectorAll('.current-plan').forEach(function(el){el.textContent='Free • all tools';});document.querySelectorAll('a,button').forEach(function(el){var t=(el.textContent||'').trim();if(/^upgrade/i.test(t)||/choose pro|manage subscription|view all plans|checkout/i.test(t)){el.style.display='none';}});}f();if(document.body)new MutationObserver(f).observe(document.body,{childList:true,subtree:true});})();"""
          needle = 'web.evaluateJavascript(js, null);'
          if needle in s and 'data-cp-free' not in s:
              s = s.replace(needle, needle + '\n        web.evaluateJavascript(' + json.dumps(free_js) + ', null);', 1)
          p.write_text(s)
          PY
          grep -q 'versionName = "1.6.1"' /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN/app/build.gradle.kts

      - name: Build APK
        working-directory: /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/creatorpulse-src/CreatorPulse-Android-REDESIGN/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-FULL-UI-FREE.apk"
          unzip -t "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-FULL-UI-FREE.apk"
          ls -lh "$GITHUB_WORKSPACE/CreatorPulse-1.6.1-FULL-UI-FREE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-1.6.1-FULL-UI-FREE
          path: CreatorPulse-1.6.1-FULL-UI-FREE.apk
          if-no-files-found: error
          retention-days: 14
