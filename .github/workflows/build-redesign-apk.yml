name: Build CreatorPulse 1.6.4 Android Phone APK

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-redesign-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild verified Android source
        shell: bash
        run: |
          set -euo pipefail
          cat android-native/source.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/creatorpulse-native-src.zip
          echo "e0ca67458cdb47de390759f8e3de74d9b35fe982907b679878b3ba8fae9b60d1  /tmp/creatorpulse-native-src.zip" | sha256sum -c -
          rm -rf /tmp/creatorpulse-native
          mkdir -p /tmp/creatorpulse-native
          unzip -q /tmp/creatorpulse-native-src.zip -d /tmp/creatorpulse-native
          test -f /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/build.gradle.kts

      - name: Apply Android phone scaling and icon refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN')
          gradle = root / 'app/build.gradle.kts'
          g = gradle.read_text()
          g = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 14', g)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.6.4"', g)
          gradle.write_text(g)

          p = root / 'app/src/main/java/com/creatorpulse/app/MainActivity.java'
          s = p.read_text()
          for old in ('CreatorPulseAndroid/1.6.0','CreatorPulseAndroid/1.6.1','CreatorPulseAndroid/1.6.2','CreatorPulseAndroid/1.6.3'):
              s = s.replace(old, 'CreatorPulseAndroid/1.6.4')

          # This is the important fix: do NOT render a 980px desktop page and shrink it.
          s = s.replace('setUseWideViewPort(true)', 'setUseWideViewPort(false)')
          s = s.replace('setLoadWithOverviewMode(true)', 'setLoadWithOverviewMode(false)')

          marker = 'ANDROID_PHONE_SCALE_164'
          if marker not in s:
              needle = 'web.getSettings().setJavaScriptEnabled(true);'
              if needle not in s:
                  raise SystemExit('Could not find WebView settings block')
              s = s.replace(
                  needle,
                  needle + '\n'
                  '        // ANDROID_PHONE_SCALE_164\n'
                  '        web.getSettings().setUseWideViewPort(false);\n'
                  '        web.getSettings().setLoadWithOverviewMode(false);\n'
                  '        web.getSettings().setTextZoom(110);\n'
                  '        web.setInitialScale(100);',
                  1
              )

          # Make the nav visibly different from the old build.
          icon_rules = [
              (r'nav\(b,"[^"]*","Home","/dashboard"\);', 'nav(b,"⌂","Home","/dashboard");'),
              (r'nav\(b,"[^"]*","Ideas","/ideas"\);', 'nav(b,"◈","Ideas","/ideas");'),
              (r'nav\(b,"[^"]*","Videos","/videos"\);', 'nav(b,"▷","Videos","/videos");'),
              (r'nav\(b,"[^"]*","Analytics","/analytics"\);', 'nav(b,"↗","Analytics","/analytics");'),
              (r'nav\(b,"[^"]*","Tools","/tools"\);', 'nav(b,"⚙","Tools","/tools");'),
          ]
          for pat, repl in icon_rules:
              s = re.sub(pat, repl, s)

          # Also replace the oversized native top-right symbols with a cleaner play/channel + profile treatment.
          s = s.replace('pill("Channel")', 'pill("▶")')
          s = s.replace('pill("CP")', 'pill("CP")')

          p.write_text(s)
          print('Patched:', p)
          print('wide viewport false =', 'setUseWideViewPort(false)' in s)
          print('overview false =', 'setLoadWithOverviewMode(false)' in s)
          print('initial scale 100 =', 'setInitialScale(100)' in s)
          print('text zoom 110 =', 'setTextZoom(110)' in s)
          print('new tools icon =', '"⚙","Tools"' in s)
          PY

      - name: Build APK
        working-directory: /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/creatorpulse-native/CreatorPulse-Android-REDESIGN/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CreatorPulse-1.6.4-ANDROID-PHONE.apk"
          unzip -t "$GITHUB_WORKSPACE/CreatorPulse-1.6.4-ANDROID-PHONE.apk"
          test -s "$GITHUB_WORKSPACE/CreatorPulse-1.6.4-ANDROID-PHONE.apk"
          sha256sum "$GITHUB_WORKSPACE/CreatorPulse-1.6.4-ANDROID-PHONE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorPulse-1.6.4-ANDROID-PHONE
          path: CreatorPulse-1.6.4-ANDROID-PHONE.apk
          if-no-files-found: error
          retention-days: 14
