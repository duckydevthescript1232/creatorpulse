<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c12;color:#f7f7fb;font-family:system-ui,-apple-system,sans-serif;padding:28px}.card{max-width:480px;width:100%;padding:30px;border:1px solid #2b2d3d;border-radius:24px;background:#11131d;box-shadow:0 24px 70px #0008}.mark{display:flex;gap:5px;align-items:end;height:48px;margin-bottom:24px}.mark i{display:block;width:10px;background:#8b5cf6;border-radius:5px}.mark i:nth-child(1){height:20px}.mark i:nth-child(2){height:31px}.mark i:nth-child(3){height:44px}.mark i:nth-child(4){height:35px}h1{margin:0 0 10px;font-size:28px}p{margin:0;color:#a8adbd;line-height:1.6}.note{margin-top:20px;padding-top:18px;border-top:1px solid #272938;font-size:13px;color:#7f8598}</style></head><body><main class="card"><div class="mark"><i></i><i></i><i></i><i></i></div><h1>You’re offline</h1><p>CreatorPulse needs the internet for live YouTube data, account sync and server-powered creator tools. Reconnect and the app will retry automatically.</p><div class="note">Pages already cached by Android may still be available, but CreatorPulse never shows fake analytics while offline.</div></main></body></html>
